# ==============================================================
# analysis_options.yaml
# ==============================================================
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: error               # ① Future待機忘れ → error
    use_build_context_synchronously: error # ① 非同期後BuildContext → error
    always_declare_return_types: error     # ① 戻り値型未明示 → error
    unused_local_variable: error
    unused_import: error

linter:
  rules:
    always_declare_return_types: true      # ① 戻り値型を必ず明示
    prefer_final_locals: true              # ① ローカル変数はfinal
    prefer_final_fields: true             # ① フィールドもfinal
    prefer_final_parameters: true         # ① パラメータもfinal
    unawaited_futures: true               # ① Future待機忘れ
    avoid_void_async: true
    use_build_context_synchronously: true # ① 非同期後のBuildContext
    sort_constructors_first: true         # ① コンストラクタを先頭に
    library_private_types_in_public_api: true # ① publicAPIにprivate型禁止
    avoid_dynamic: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_single_quotes: true
    use_super_parameters: true
    avoid_print: true
